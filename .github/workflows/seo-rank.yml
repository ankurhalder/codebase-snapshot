name: SEO rank

# Records where this package actually ranks, once a week.
#
# The point is the trend, not the number. npm's search index reflects the
# published manifest within about 45 minutes, so a metadata change shows up here
# on the next run; GitHub's index is rebuilt on push. Run this after a release to
# see what the change bought, and let the weekly run catch a slow slide that no
# one would otherwise notice.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, with the release version in a comment: this workflow holds
      # `contents: write` and commits a log, so a moved tag could change what runs with that token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Measure
        env:
          # Without a token the search API allows ten requests a minute, which
          # this query set can exceed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run seo-rank -- --record

      # The log is the artifact. Commit it so the next run is comparable, and so
      # the history is reviewable in git rather than in a dashboard nobody opens.
      - name: Record the run
        run: |
          if git diff --quiet -- seo-log.jsonl; then
            echo "no new measurement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-log.jsonl
          git commit -m "chore: record weekly search positions"
          git push
