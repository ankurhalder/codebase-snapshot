name: Docs site

# The site is rendered from README.md and docs/*.md by scripts/build-site.mjs, so
# it can only change when one of those does. Building on every push to main would
# burn a deploy for every source change that cannot affect it.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "llms.txt"
      - "scripts/build-site.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it. Cancelling a deploy
# mid-flight can leave the site on a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs with the release version in a trailing
      # comment, exactly as in `pr.yml` and `publish.yml`. This workflow holds `pages: write` and
      # `id-token: write`, so a moved tag is the one thing it must not trust.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Render the site
        run: npm run site

      # A misspelt internal link is invisible until someone clicks it, and by
      # then the page is already published. Fail the deploy instead.
      - name: Every internal link resolves
        run: node scripts/check-site-links.mjs

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
