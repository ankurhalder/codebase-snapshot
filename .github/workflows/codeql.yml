name: CodeQL

# Code scanning is one of the maintenance signals Glama reads. It also gives the repository a
# second, independent look at the TypeScript source on every push to main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
