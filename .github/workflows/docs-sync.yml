name: Docs sync

# The repository docs feed the website, but the wiki is a separate git repository. A release that
# updates one and forgets the other leaves a reader on a stale page, and nothing in the offline
# verify gate can see it. This workflow treats the live wiki and site as release surfaces: it
# clones the wiki, checks every linked page, every copyable pin and the version labels against
# PUBLISHED, and fetches the deployed site's Markdown twin. It fails rather than warning.
on:
  workflow_run:
    workflows: ["Docs site"]
    types: [completed]
  # A wiki-only edit does not touch the main repository, so this event is the only immediate
  # signal that the separate wiki repository changed.
  gollum:
  schedule:
    # Daily, so a wiki-only edit is checked even when no docs file changed.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Check docs, wiki and site agree
        run: npm run check:docs
