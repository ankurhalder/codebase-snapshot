name: Dependabot auto-merge

# Dependabot PRs still go through the normal pull-request gate. Once every check is green, a
# minor or patch update is squashed automatically; a major update is deliberately left for a human.
# This runs on pull_request_target so the token can merge, but it never checks out or executes the
# pull request's code: the workflow only reads metadata and calls the GitHub CLI.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read the Dependabot update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks, then merge minor and patch updates
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "Draft PR; leaving it open."
            exit 0
          fi

          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,do-not-merge,*)
              echo "The do-not-merge label is set; leaving it open."
              exit 0
              ;;
          esac

          # Do not use gh pr checks --watch: this job's own auto-merge check is in the same list,
          # so it would wait for itself until the job timeout. Poll the named checks instead.
          expected=("verify (18)" "verify (20)" "verify (22)" "mcp-windows-smoke")
          ready=0
          for attempt in $(seq 1 90); do
            checks="$(gh pr checks "$PR_NUMBER" --json name,state,bucket,workflow || true)"
            if printf '%s' "$checks" | jq -e 'any(.[]; .name != "auto-merge" and (.bucket == "fail" or .bucket == "cancel"))' >/dev/null; then
              echo "A non-auto-merge check failed; leaving the PR open."
              exit 0
            fi
            ready=1
            for name in "${expected[@]}"; do
              bucket="$(printf '%s' "$checks" | jq -r --arg name "$name" '[.[] | select(.name == $name)][0].bucket // "missing"')"
              if [ "$bucket" != "pass" ]; then
                ready=0
              fi
            done
            if [ "$ready" -eq 1 ]; then
              break
            fi
            sleep 20
          done

          if [ "$ready" -ne 1 ]; then
            echo "The expected checks did not finish green in time; leaving the PR open."
            exit 0
          fi

          head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$head"
