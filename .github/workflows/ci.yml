name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not cancel the others: a red 18.x job hides
      # whether 20.x and 22.x are also affected.
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      # Third-party actions are pinned to full commit SHAs (with the release
      # version in a trailing comment) so a retagged or hijacked release cannot
      # silently change what runs in CI.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build explicitly so typecheck/coverage/pack all inspect fresh artifacts.
      # (`npm test` also rebuilds via its `pretest` script, which keeps a local
      # `npm test` from passing against a stale dist.)
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Fails on high/critical advisories in the dependency tree.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      # `--experimental-test-coverage` is diagnostic, not a gate: this repo sets
      # no coverage threshold, and the experimental reporter itself crashes on
      # Node 18/20 with `TypeError: Cannot read properties of undefined
      # (reading 'line')`. Run it only where the reporter is reliable, and never
      # let a reporter bug fail the build.
      - name: Run tests with coverage
        if: matrix.node-version == '22.x'
        continue-on-error: true
        run: node --test --experimental-test-coverage tests/*.test.js

      # Guards the published artifact: a tarball missing an entry point, the
      # readme/license, or shipping sourcemaps must fail here, not on npm.
      - name: Verify published tarball contents
        run: |
          node --input-type=module -e '
          import { spawnSync } from "node:child_process";

          const REQUIRED = ["dist/index.js", "dist/index.cjs", "dist/index.d.ts", "dist/index.d.cts", "dist/cli.js", "dist/cli.cjs", "dist/cli.d.ts", "dist/bin.js", "README.md", "LICENSE"];

          // npm is a .cmd shim on Windows (needs a shell); on Linux/macOS it spawns directly.
          function pack(args) {
            return process.platform === "win32"
              ? spawnSync("npm.cmd " + args.join(" "), { encoding: "utf8", shell: true })
              : spawnSync("npm", args, { encoding: "utf8" });
          }

          function listTarballFiles() {
            const asJson = pack(["pack", "--dry-run", "--json"]);
            const raw = (asJson.stdout || "").trim();

            if (asJson.status === 0 && raw.startsWith("[")) {
              try {
                return JSON.parse(raw).flatMap((entry) => (entry.files || []).map((file) => file.path));
              } catch {
                // Older npm builds emit non-JSON output; fall back to parsing notices below.
              }
            }

            const plain = pack(["pack", "--dry-run"]);
            const text = (plain.stdout || "") + "\n" + (plain.stderr || "");
            if (plain.status !== 0) {
              console.error("npm pack --dry-run exited with code " + plain.status);
              console.error(text);
              return null;
            }

            const lines = text.split("\n");
            const start = lines.findIndex((line) => line.includes("Tarball Contents"));
            if (start === -1) return null;

            const paths = [];
            for (const line of lines.slice(start + 1)) {
              // npm >= 9 prints bare headers, older npm wraps them in === banners.
              if (line.includes("Tarball Details") || line.includes("===")) break;
              const cleaned = line.replace(/^npm notice\s+/, "").trim();
              if (!cleaned) continue;
              paths.push(cleaned.split(/\s+/).pop());
            }
            return paths.filter(Boolean);
          }

          const files = listTarballFiles();
          if (!files) {
            console.error("FAIL: could not read the tarball file list from npm pack --dry-run");
            process.exit(1);
          }

          console.log("tarball contains " + files.length + " files:");
          for (const file of files) console.log("  " + file);

          const problems = [];
          for (const required of REQUIRED) {
            if (!files.includes(required)) problems.push("missing required file: " + required);
          }
          const sourcemaps = files.filter((file) => file.endsWith(".map"));
          if (sourcemaps.length > 0) problems.push("tarball must not contain .map files: " + sourcemaps.join(", "));

          if (problems.length > 0) {
            for (const problem of problems) console.error("FAIL: " + problem);
            process.exit(1);
          }

          console.log("OK: tarball has every required file and no .map artifacts");
          '

  # The package is published once to the npm registry but consumed by every
  # npm-compatible client. Those clients differ in how they resolve `bin`
  # entries, how they lay out node_modules, and (yarn Berry) whether
  # node_modules exists at all — so "it works with npm" does not imply "it works
  # with pnpm". Each client here installs the *real packed tarball* and runs a
  # real `generate`, so a broken `bin`/`exports` field fails the build instead
  # of a user's terminal.
  client-install:
    name: install via ${{ matrix.client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: npm
            install_cmd: npm install -D "./$TARBALL"
            exec_cmd: npx codebase-snapshot
          - client: yarn-classic
            install_cmd: npx --yes yarn@1.22.22 add -D "./$TARBALL"
            exec_cmd: npx --yes yarn@1.22.22 codebase-snapshot
          - client: yarn-berry-pnp
            install_cmd: corepack yarn add -D "./$TARBALL"
            exec_cmd: corepack yarn codebase-snapshot
          - client: pnpm
            install_cmd: npx --yes pnpm@10 add -D "./$TARBALL"
            exec_cmd: npx --yes pnpm@10 exec codebase-snapshot
          - client: bun
            install_cmd: npx --yes bun@1.4 add -d "./$TARBALL"
            exec_cmd: npx --yes bun@1.4 run codebase-snapshot
    env:
      # corepack otherwise blocks on an interactive download prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pack the exact artifact that would be published, then install it from a
      # local path so CI never depends on the registry copy being up to date.
      #
      # The tarball keeps its versioned name instead of being renamed to a fixed
      # `pkg.tgz`. yarn classic caches `file:` dependencies keyed by the relative
      # path, so a stable name plus a warm cache can install a *previous*
      # version's content from a fresh tarball — observed serving 2.0.0 while the
      # packed tarball was 2.1.0. A versioned name makes that impossible.
      - name: Pack the tarball
        run: |
          set -euo pipefail
          echo "PACKAGE_VERSION=$(npm pkg get version | tr -d '"')" >> "$GITHUB_ENV"
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/consumer"
          mv "$RUNNER_TEMP/$TARBALL" "$RUNNER_TEMP/consumer/$TARBALL"

      # Berry's default linker is strict PnP: there is no node_modules directory,
      # and the runtime `typescript` dependency has to resolve through .pnp.cjs.
      # That is the interesting case, so pin it explicitly rather than inheriting
      # whatever the default is.
      #
      # The `packageManager` field is written ONLY here. Yarn classic and pnpm
      # both hard-refuse a project that pins a different package manager
      # ("This project's package.json defines packageManager: yarn@4.6.0"),
      # so stamping it for every client would break two of the five jobs.
      - name: Enable strict PnP and pin yarn Berry (this client only)
        if: matrix.client == 'yarn-berry-pnp'
        working-directory: ${{ runner.temp }}/consumer
        run: |
          printf '{"name":"consumer","version":"1.0.0","private":true,"packageManager":"yarn@4.6.0"}\n' > package.json
          printf 'nodeLinker: pnp\n' > .yarnrc.yml

      - name: ${{ matrix.client }} — install
        working-directory: ${{ runner.temp }}/consumer
        env:
          INSTALL_CMD: ${{ matrix.install_cmd }}
        run: |
          set -euo pipefail
          [ -f package.json ] || printf '{"name":"consumer","version":"1.0.0","private":true}\n' > package.json
          eval "$INSTALL_CMD"

      # `--version` alone can pass without ever loading the AST stack; generating
      # from a real TypeScript file forces the runtime `typescript` dependency to
      # resolve. That resolution is exactly what breaks under strict PnP.
      - name: ${{ matrix.client }} — run a real snapshot
        working-directory: ${{ runner.temp }}/consumer
        env:
          EXEC_CMD: ${{ matrix.exec_cmd }}
        run: |
          set -euo pipefail
          # Match a line that *is* the version. Client wrappers pollute stdout:
          # yarn classic prints "yarn run v1.22.22" before the command and
          # "Done in 0.37s." after it, so neither `tail -1` nor "first version
          # token found" is correct.
          ACTUAL="$(eval "$EXEC_CMD" --version 2>/dev/null | tr -d '\r' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          echo "expected v$PACKAGE_VERSION, got '${ACTUAL:-<no version found>}'"
          [ "$ACTUAL" = "v$PACKAGE_VERSION" ] || { echo "FAIL: version mismatch"; exit 1; }

          mkdir -p src
          printf 'export function add(a: number, b: number): number { return a + b; }\n' > src/math.ts
          eval "$EXEC_CMD" generate
          test -f snapshot/manifest.json || { echo "FAIL: no manifest produced"; exit 1; }
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("snapshot/manifest.json", "utf8"));
            const entry = manifest.files.find((file) => file.relativePath === "src/math.ts");
            if (!entry) {
              console.error("FAIL: src/math.ts is missing from the manifest");
              process.exit(1);
            }
            if (entry.language !== "typescript") {
              console.error("FAIL: expected language typescript, got " + entry.language);
              process.exit(1);
            }
            // `summaryQuality` is emitted from 2.1.0 onward. When present it must
            // be "ast": that is what proves the TypeScript compiler actually
            // loaded, which is precisely what fails under yarn Berry PnP. Guarded
            // so this job also passes on the 2.0.0 line, where the field does not
            // exist yet.
            if ("summaryQuality" in entry && entry.summaryQuality !== "ast") {
              console.error("FAIL: expected summaryQuality ast, got " + entry.summaryQuality);
              process.exit(1);
            }
            console.log("OK: src/math.ts analyzed" + ("summaryQuality" in entry ? " with summaryQuality=ast" : ""));
          '
          echo "OK: ${{ matrix.client }} installed the tarball and generated a snapshot"
