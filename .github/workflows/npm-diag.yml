name: npm diagnostics

# Read-only. Answers "why did unpublish report success while the registry kept
# the versions" without needing anyone's laptop.
#
# `npm stage list`/`npm stage view` exist in npm versions that support staged
# publishing. If the account has it enabled, an unpublish can be queued for
# approval instead of executed — which is exactly the shape of this symptom, and
# exactly how the `0.0.0-stage` version appeared in the first place. Every command
# is tolerant so one unknown subcommand does not hide the others.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Who and where
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "user: $(npm whoami 2>&1 || true)"

      - name: Stage support
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- npm stage list ---"
          npm stage list 2>&1 || echo "exit=$?"

      - name: What the registry currently serves
        run: |
          for spec in codebase-snapshot codebase-snapshot@4.5.0 codebase-snapshot@0.0.0-stage create-codebase-snapshot@4.5.0; do
            printf '%-40s ' "$spec"
            npm view "$spec" version 2>&1 | tail -1
          done

      - name: Deprecation flags
        run: |
          for spec in codebase-snapshot@0.9.0 codebase-snapshot@4.5.0 codebase-snapshot@0.0.0-stage; do
            printf '%-40s ' "$spec"
            npm view "$spec" deprecated 2>&1 | tail -1
          done
