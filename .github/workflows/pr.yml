name: Pull request gate

# The same gate a release runs, on every pull request and every push to main.
#
# Before this workflow existed, the Node 18/20/22 matrix below ran only at release time. A
# compatibility break therefore first surfaced during a publish; 0.9.14 needed four attempts to get
# out for exactly that reason, and each attempt spent a version number. Catching the break on the
# branch is cheaper than catching it on a tag, and it turns the "works on Node 18" claim in the
# package metadata into a tested statement rather than a promise.
#
# `npm run verify` is the whole gate — lint, typecheck, the full test suite, the docs/site checks and
# the tarball check — so a green local verify is the same code path a green pull request takes. The
# release workflow (`publish.yml`) still re-runs it on the tag, because a tag can be created from a
# commit that never went through a pull request.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run's answer obsolete. Cancelling it keeps the
# owner's shared Actions allowance for the run that reflects the code reviewers will actually see.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # One failing version must not cancel the others: the point is to learn which versions work.
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      # Third-party actions are pinned to full commit SHAs (with the release version in a trailing
      # comment), exactly as in `publish.yml`: a moved tag must not be able to change what runs
      # here just because this workflow is the one developers trigger by pushing a branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The same gate a developer runs locally: lint, typecheck, the full test suite, the
      # docs/site checks and a check of the exact tarball that would be uploaded.
      - name: Verify on Node ${{ matrix.node }}
        run: npm run verify
