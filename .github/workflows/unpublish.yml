name: Unpublish a version

# Unpublishing is a last resort, and this workflow exists so that when it is the
# right call it is a reviewed, logged action rather than a command typed into a
# terminal with a long-lived token.
#
# npm only allows unpublishing a version within 72 hours of publishing it, and
# refuses entirely when another package depends on that version. Publish order
# therefore matters on the way out too: unpublish the dependent first.
#
# Give the exact spec, and confirm.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Exact spec to unpublish, e.g. codebase-snapshot@0.0.0-stage"
        required: true
        type: string
      confirm:
        description: 'Type "yes" to confirm. Anything else aborts.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    # See the note in `deprecate.yml`: a dispatch input interpolated into `run:` is expanded before
    # bash parses the script, so a crafted `spec` could run a command in a job that carries the npm
    # token. The values arrive through the environment and are referenced quoted.
    env:
      SPEC: ${{ inputs.spec }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Refuse unless confirmed
        run: |
          if [ "$CONFIRM" != "yes" ]; then
            echo '::error::confirmation was not "yes" — nothing was changed'
            exit 1
          fi
          case "$SPEC" in
            *@*.*.*) echo "unpublishing $SPEC" ;;
            *) echo "::error::spec must be an exact version like name@1.2.3"; exit 1 ;;
          esac

      # Pinned to a full commit SHA like every other action in a job that holds a long-lived token:
      # a moved tag must not be able to change the code that runs beside NPM_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Unpublish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm unpublish "$SPEC" --force

      - name: Confirm it is gone
        run: |
          set -euo pipefail
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "::error::$SPEC is still resolvable"
            exit 1
          fi
          echo "$SPEC is no longer resolvable"
