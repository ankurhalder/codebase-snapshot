name: Publish to NPM

# The only workflow in the repository, on purpose.
#
# The owner pays for GitHub Actions minutes out of a shared allowance across several projects, so
# Actions runs on release events (and manual dispatch) and nothing else. `npm run verify` is the
# whole gate — lint, typecheck, the full suite, the tarball check — so a green local verify is the
# same code path the release takes.
#
# Since 4.3.0 that gate runs on **every supported Node version**, not just the developer's: the
# package says `engines: >=18` and until this release no run had ever executed on 18 or 20. Three
# jobs of about two minutes per release is the price of that claim being true; the publish job
# cannot start until all three pass.
on:
  release:
    types: [published]
  workflow_dispatch:

# Serialize releases: two publishes must never overlap, and an in-flight
# publish must never be cancelled, hence cancel-in-progress: false.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any branch, so gate it to main.
    # `release` events publish the tagged commit (refs/tags/<tag>), so they are
    # allowed through explicitly and keep working.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      # One failing version must not cancel the others: the point is to learn which versions work.
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The same gate a developer runs locally: lint, typecheck, the full test
      # suite, and a check of the exact tarball that would be uploaded. It fails
      # the publish rather than shipping a package this repository never tested.
      - name: Verify on Node ${{ matrix.node }}
        run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Third-party actions are pinned to full commit SHAs (with the release
      # version in a trailing comment) so a retagged or hijacked release cannot
      # silently change what runs during a publish.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The verify matrix above already ran the full gate on 18, 20 and 22 for this exact commit
      # — that is what `needs: verify` guarantees — so uploading is all that is left.

      # Guarded so a partial failure later in the job can be recovered by simply
      # re-running: without this, npm refuses with "cannot publish over" and the
      # only way forward is a version bump.
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(npm pkg get version | tr -d '"')"
          if npm view "codebase-snapshot@$VERSION" version >/dev/null 2>&1; then
            echo "codebase-snapshot@$VERSION is already on the registry; skipping"
            exit 0
          fi
          npm publish --access public --provenance

      # `npm create codebase-snapshot` is advertised in the changelog and README
      # and lives in packages/create, but nothing ever published it — so the
      # command resolved to a 404 while docs/install.md told people to run it.
      #
      # Publish from *inside* the directory. `npm publish packages/create` is
      # parsed as the GitHub shorthand owner/repo, and npm then tries
      # `git ls-remote ssh://git@github.com/packages/create.git` and fails with
      # exit 128 and a publickey error.
      - name: Publish create-codebase-snapshot (skip if this version exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("packages/create/package.json","utf8")).version)')"
          if npm view "create-codebase-snapshot@$VERSION" version >/dev/null 2>&1; then
            echo "create-codebase-snapshot@$VERSION is already on the registry; nothing to do"
            exit 0
          fi
          cd packages/create
          npm publish --access public --provenance

      # 0.9.0 moved the package from `@ankurhalder/codebase-snapshot` to the
      # unscoped `codebase-snapshot`. Deprecating rather than unpublishing keeps
      # every existing `npx @ankurhalder/codebase-snapshot` instruction resolving,
      # while the registry tells anyone who installs the old name where it went.
      # The old name stays at its last published version; it is not republished.
      #
      # Checked first rather than re-applied blindly: deprecating an
      # already-deprecated package answers 422, and a red herring in a green run
      # trains people to ignore the log.
      - name: Deprecate the previous scoped name
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="$(npm view "@ankurhalder/codebase-snapshot@4.4.1" deprecated 2>/dev/null || true)"
          if [ -n "$CURRENT" ]; then
            echo "already deprecated: $CURRENT"
            exit 0
          fi
          npm deprecate "@ankurhalder/codebase-snapshot@*" \
            "Renamed to codebase-snapshot, which is the supported package. Run: npx codebase-snapshot@latest setup"
