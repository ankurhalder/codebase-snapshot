# Secret scanning / push protection exclusions.
#
# The audit PoC corpus contains deliberate, synthetic samples of every credential
# format the redaction engine is meant to catch (Stripe keys, Slack tokens and
# webhooks, Twilio keys, AWS ids, database URIs, PEM blocks, ...). They are test
# vectors, not credentials: none of them can authenticate against any service,
# and they exist specifically so the scanner can be proven to detect them.
#
# Excluding the corpus keeps push protection meaningful for real code instead of
# producing unfixable alerts on files whose whole purpose is to hold fake keys.
paths-ignore:
  - "audit/**"
