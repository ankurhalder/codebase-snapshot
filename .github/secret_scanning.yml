# Secret scanning / push protection exclusions.
#
# This repository is a secret-redaction engine. Its test suites, rule definitions and some
# verification reports contain credential-shaped strings *on purpose*: they are the vectors the
# engine is meant to detect, they cannot authenticate against any service, and they exist so that
# detection can be proved. They are not credentials.
#
# The exclusions are deliberately narrow. `docs/**`, `**/*.md` and `llms.txt` used to be ignored
# wholesale, which put every published page and the README outside the detector: a real token
# pasted into a doc would have gone unreported. Those are scanned now. The documented example
# values the scanners may still report are listed in SECURITY.md; they are reviewed, not hidden.
#
# If you add a fixture outside these paths, use a placeholder no detector matches, or extend this
# list deliberately in the same commit - do not weaken detection.
paths-ignore:
  # Test suites: the engine's own vectors, inline in the tests that exercise them.
  - "tests/**"
  # Verification reports quote the probes they describe, including the synthetic values.
  - "audit/**"
  - "package-lock.json"
  # Rule definitions and their worked examples: patterns, not credentials.
  - "src/security/patterns.ts"
  - "src/security/redact.ts"
