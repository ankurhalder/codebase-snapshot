# Secret scanning / push protection exclusions.
#
# This repository is a secret-redaction engine. Its test suites, rule definitions and
# documentation contain credential-shaped strings *on purpose*: they are the vectors the
# engine is meant to detect, they cannot authenticate against any service, and they exist
# so that detection can be proved. They are not credentials.
#
# Excluding those surfaces keeps the scanner meaningful for real code instead of raising
# the same unfixable alert on every push, where the only available answer is "used in
# tests". Anywhere outside these paths a real credential is still reported normally.
#
# If you add a fixture outside these paths, use a placeholder no detector matches, or
# extend this list deliberately in the same commit - do not weaken detection.
paths-ignore:
  - "tests/**"
  - "docs/**"
  - "**/*.md"
  - "llms.txt"
  - "package-lock.json"
  # Rule definitions and their worked examples: patterns, not credentials.
  - "src/security/patterns.ts"
  - "src/security/redact.ts"
