# Secret scanning / push protection exclusions.
#
# The redaction suites assert detection, so they contain synthetic samples of the
# credential formats the engine is meant to catch: an AWS example id, a Stripe
# test key, database URIs with passwords, a JWT and a PEM block. They are test
# vectors, not credentials — none of them can authenticate against any service,
# and they exist specifically so the scanner can be proven to detect them.
#
# Excluding the suites keeps push protection meaningful for real code instead of
# producing unfixable alerts on files whose whole purpose is to hold fake keys.
paths-ignore:
  - "tests/**"
